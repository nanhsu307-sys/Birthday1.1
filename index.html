<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f3">
  <title>Happy Birthday, Big Brother!</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #49374a;
      --muted: #806d80;
      --pink: #f4a8bd;
      --deep-pink: #d96f91;
      --gold: #d8ad58;
      --shadow: 0 18px 45px rgba(102,63,91,.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 10% 8%, rgba(255,255,255,.9), transparent 36%),
        radial-gradient(ellipse at 90% 26%, rgba(255,221,232,.72), transparent 32%),
        linear-gradient(160deg, #fff0f3 0%, #fff7e9 48%, #f4efff 100%);
    }

    h1, h2, h3 {
      font-family: "Playfair Display", Georgia, serif;
    }

    a {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================
       BACKGROUND ANIMATIONS
    ===================================== */

    .page-decor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      transition: opacity 1.5s ease;
    }

    body.intro-running .page-decor {
      opacity: 0;
    }

    body.birthday-revealed .page-decor {
      opacity: 1;
    }

    .bunting {
      position: absolute;
      top: 0;
      left: -3%;
      width: 106%;
      height: 44px;
      display: flex;
      justify-content: space-around;
      border-top: 3px solid rgba(143,109,139,.5);
    }

    .bunting span {
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 27px solid #f4a8bd;
      filter: drop-shadow(0 2px 2px rgba(75,47,75,.08));
      transform-origin: top center;
      animation: flag-sway 3s ease-in-out infinite alternate;
    }

    .bunting span:nth-child(3n) {
      border-top-color: #f5d17a;
      animation-delay: -.8s;
    }

    .bunting span:nth-child(3n + 1) {
      border-top-color: #a8d7b4;
      animation-delay: -1.4s;
    }

    .bunting span:nth-child(4n) {
      border-top-color: #a9c9f1;
      animation-delay: -.4s;
    }

    .bunting span:nth-child(5n) {
      border-top-color: #c5afe9;
      animation-delay: -1s;
    }

    .ribbon {
      position: absolute;
      top: 95px;
      width: 52px;
      height: 160px;
      border: 3px solid rgba(217,111,145,.5);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(18deg);
    }

    .ribbon-one {
      left: -24px;
    }

    .ribbon-two {
      top: 260px;
      right: -25px;
      transform: rotate(205deg);
      border-color: rgba(108,168,232,.6);
      border-left-color: transparent;
      border-bottom-color: transparent;
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 15px;
      border-radius: 2px;
      animation: confetti-fall 8s linear infinite;
    }

    .confetti-one {
      left: 10%;
      background: #f3a2bb;
      animation-delay: -1s;
    }

    .confetti-two {
      left: 28%;
      background: #f4cf6b;
      animation-delay: -5s;
    }

    .confetti-three {
      left: 54%;
      background: #9dcfb0;
      animation-delay: -3s;
    }

    .confetti-four {
      left: 73%;
      background: #9fc7ef;
      animation-delay: -6s;
    }

    .confetti-five {
      left: 87%;
      background: #b8a0e3;
      animation-delay: -2s;
    }

    .confetti-six {
      left: 43%;
      background: #e99d8d;
      animation-delay: -7s;
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 34px;
      height: 44px;
      border-radius: 50% 50% 46% 46%;
      opacity: .72;
      animation: balloon-rise 18s linear infinite;
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 14px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 7px solid currentColor;
    }

    .balloon i {
      position: absolute;
      top: 48px;
      left: 17px;
      width: 1px;
      height: 42px;
      background: rgba(94,77,103,.35);
    }

    .balloon-blue {
      left: 5%;
      color: #6ca8e8;
      background: #6ca8e8;
      animation-delay: -8s;
    }

    .balloon-pink {
      left: 83%;
      color: #ef9db8;
      background: #ef9db8;
      animation-delay: -3s;
      animation-duration: 21s;
    }

    .balloon-yellow {
      left: 92%;
      color: #f0cc70;
      background: #f0cc70;
      animation-delay: -14s;
      animation-duration: 20s;
    }

    .balloon-green {
      left: 15%;
      color: #91caa3;
      background: #91caa3;
      animation-delay: -12s;
      animation-duration: 22s;
    }

    .balloon-purple {
      left: 70%;
      color: #b5a0e0;
      background: #b5a0e0;
      animation-delay: -5s;
      animation-duration: 19s;
    }

    /* =====================================
       MAIN BIRTHDAY SCREEN
    ===================================== */

    .hero {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      padding: 82px 22px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      isolation: isolate;
      transition: opacity 1s ease;
    }

    body.intro-running {
      height: 100svh;
      overflow: hidden;
      background: #10122f;
      color: white;
    }

    body.intro-running .hero {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      padding: 0;
      pointer-events: none;
      z-index: 1001;
    }

    body.intro-running .hero > *:not(.cake-scene) {
      opacity: 0;
      visibility: hidden;
    }

    .party-hat {
      margin-bottom: 5px;
      font-size: 2.2rem;
      animation: hat-wobble 2.5s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--deep-pink);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.65rem, 12vw, 4.5rem);
      line-height: 1.04;
      letter-spacing: -.045em;
      animation: fade-up .9s both;
    }

    h1 span {
      color: #cf6e91;
    }

    .hero-subtitle {
      max-width: 350px;
      margin: 17px auto 0;
      color: var(--muted);
      font-size: .96rem;
      line-height: 1.7;
    }

    .primary-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      margin-top: 12px;
      padding: 13px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #df83a1, #c86b8f);
      color: white;
      font: inherit;
      font-weight: 700;
      font-size: .9rem;
      text-decoration: none;
      box-shadow: 0 9px 22px rgba(200,107,143,.24);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      pointer-events: auto;
    }

    .primary-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 13px 27px rgba(200,107,143,.3);
    }

    .tiny-note {
      margin: 15px 0 0;
      color: #a38b9d;
      font-size: .73rem;
    }

    /* =====================================
       WHITE-AND-GOLD CAKE
    ===================================== */

    .cake-scene {
      position: relative;
      width: min(310px, 88vw);
      height: 225px;
      margin: 18px auto 8px;
      flex-shrink: 0;
      animation:
        cake-pop 1.1s cubic-bezier(.2,.9,.3,1.2) both,
        cake-float 4s 1.1s ease-in-out infinite;
    }

    body.intro-running .cake-scene {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: 0;
      transform: translate(-50%, -50%) scale(.92);
      opacity: 0;
      visibility: hidden;
      animation: none;
      transition:
        opacity 2.2s ease,
        transform 1.1s cubic-bezier(.2,.8,.2,1),
        top 1.1s cubic-bezier(.2,.8,.2,1),
        left 1.1s cubic-bezier(.2,.8,.2,1);
    }

    body.intro-running .cake-scene.cake-revealed {
      opacity: 1;
      visibility: visible;
    }

    body.intro-running .cake-scene .cake-sparkle {
      opacity: 0;
    }

    .cake {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid #e8dfd2;
      border-radius: 12px 12px 19px 19px;
      background: linear-gradient(
        90deg,
        #e5dfd6 0%,
        #fffdf8 18%,
        #fff 52%,
        #eee8df 100%
      );
      box-shadow:
        inset -7px 0 12px rgba(158,133,111,.1),
        0 7px 10px rgba(111,76,78,.08);
    }

    .cake-top {
      bottom: 126px;
      z-index: 3;
      width: 112px;
      height: 42px;
      border-radius: 50% 50% 10px 10px / 35% 35% 10px 10px;
    }

    .cake-middle {
      bottom: 78px;
      z-index: 2;
      width: 174px;
      height: 55px;
    }

    .cake-bottom {
      bottom: 22px;
      z-index: 1;
      width: 232px;
      height: 65px;
    }

    .icing-drip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 13px;
      border-bottom: 2px solid rgba(216,173,88,.7);
      border-radius: 50%;
      background: linear-gradient(90deg, #fff9ec, #fff, #f2e6d4);
    }

    .icing-drip::after {
      content: "";
      position: absolute;
      left: 19%;
      top: 5px;
      width: 13px;
      height: 11px;
      border-radius: 0 0 9px 9px;
      background: #fffaf0;
      box-shadow:
        36px 2px 0 -1px #fffaf0,
        74px 0 0 -1px #fffaf0;
    }

    .gold-line {
      position: absolute;
      top: 23px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(
        90deg,
        transparent,
        #c99b42,
        #f6dfa0,
        #c99b42,
        transparent
      );
    }

    .cake-plate {
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: 270px;
      height: 15px;
      transform: translateX(-50%);
      border: 1px solid #dfd0bc;
      border-radius: 50%;
      background: linear-gradient(#fff, #e3d6c7);
      box-shadow: 0 8px 12px rgba(101,66,80,.12);
    }

    .candles {
      position: absolute;
      bottom: 163px;
      left: 50%;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(19, minmax(0, 1fr));
      grid-template-rows: 1fr;
      align-items: end;
      justify-items: center;
      gap: 0;
      width: 110px;
      height: 34px;
      transform: translateX(-50%);
    }

    .candle {
      position: relative;
      width: 4px;
      height: 26px;
      border-radius: 2px 2px 1px 1px;
      background: repeating-linear-gradient(
        135deg,
        #d8ad58 0 4px,
        #fff4d7 4px 8px
      );
      box-shadow: 0 0 5px rgba(240,190,86,.18);
    }

    .candle i {
      position: absolute;
      top: -10px;
      left: -1.5px;
      width: 7px;
      height: 11px;
      border-radius: 50% 50% 45% 45%;
      transform-origin: center bottom;
      background: radial-gradient(
        ellipse at 50% 70%,
        #fff7b8 0 15%,
        #ffc34d 36%,
        #f48d51 66%,
        transparent 70%
      );
      filter: drop-shadow(0 0 5px #ffc85c);
      animation: flame-flicker .7s ease-in-out infinite alternate;
    }

    .candle.extinguishing {
      animation: candle-blow .65s cubic-bezier(.18,.72,.24,1) both;
    }

    .candle.extinguishing i {
      animation: flame-blow .65s ease-in forwards;
    }

    .candle.extinguished i {
      opacity: 0;
      animation: none;
      filter: none;
    }

    .candle.extinguished::after {
      content: "";
      position: absolute;
      top: -11px;
      left: 1px;
      width: 3px;
      height: 12px;
      border-radius: 50%;
      background: rgba(210,210,220,.4);
      filter: blur(2px);
      animation: smoke-rise 1.2s ease-out forwards;
    }

    .cake-sparkle {
      position: absolute;
      z-index: 5;
      color: #d5a746;
      animation: sparkle 2s ease-in-out infinite;
    }

    .sparkle-a {
      top: 90px;
      left: 25px;
      font-size: 1.5rem;
    }

    .sparkle-b {
      top: 45px;
      right: 24px;
      font-size: 1.8rem;
      animation-delay: -.8s;
    }

    .sparkle-c {
      right: 43px;
      bottom: 48px;
      font-size: 1.1rem;
      animation-delay: -1.3s;
    }

    /* =====================================
       CINEMATIC INTRO
    ===================================== */

    .birthday-intro {
      position: fixed;
      inset: 0;
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(
        ellipse at 50% 50%,
        #29284f 0%,
        #191a3b 48%,
        #10122f 100%
      );
      transition: background 2s ease, opacity .9s ease;
      isolation: isolate;
    }

    body.candles-revealing .birthday-intro {
      background: transparent;
    }

    .firework-greeting {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      pointer-events: none;
      animation: greeting-disappear .8s ease-out forwards;
    }

    .firework-greeting span {
      position: relative;
      display: block;
      padding: 0 14px;
      color: #fff9e9;
      text-align: center;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.4rem, 10vw, 6.3rem);
      font-weight: 800;
      letter-spacing: .025em;
      line-height: 1.08;
      text-shadow:
        0 0 7px #fff,
        0 0 18px #f5d17a,
        0 0 42px #e9a64c;
      animation: firework-text .8s cubic-bezier(.12,.8,.22,1) both;
    }

    .firework-greeting span::before,
    .firework-greeting span::after {
      content: "✦  ·  ✧  ·  ✦";
      position: absolute;
      top: 50%;
      left: 50%;
      width: max-content;
      color: #ffe8a3;
      font-family: Georgia, serif;
      font-size: clamp(1.1rem, 4vw, 2.2rem);
      letter-spacing: .3em;
      text-shadow: 0 0 14px #ffbf57;
      animation: firework-burst .8s ease-out both;
    }

    .firework-greeting span::before {
      --burst-x: -1;
      --burst-y: -1;
    }

    .firework-greeting span::after {
      --burst-x: 1;
      --burst-y: 1;
    }

    .intro-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 12%,
        rgba(6,7,25,.15) 55%,
        rgba(4,5,19,.45) 100%
      );
      opacity: 0;
      transition: opacity 2s ease;
    }

    .fade-to-dark .intro-vignette {
      opacity: 1;
    }

    .blow-button {
      position: absolute;
      inset: 0;
      z-index: 8;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: transparent;
      opacity: 0;
      font-size: 1px;
      cursor: pointer;
      pointer-events: none;
      touch-action: manipulation;
    }

    .blow-button.button-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .blow-button:focus-visible {
      outline: 3px solid rgba(255,255,255,.7);
      outline-offset: -8px;
    }

    .blow-hint {
      position: absolute;
      z-index: 9;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      width: calc(100% - 36px);
      margin: 0;
      transform: translate(-50%, 12px);
      color: #fff4d8;
      text-align: center;
      font: 600 clamp(.95rem, 3.8vw, 1.2rem)/1.4 "DM Sans", system-ui, sans-serif;
      letter-spacing: .02em;
      text-shadow: 0 0 12px rgba(255,204,117,.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s ease, transform .7s ease;
    }

    .blow-hint.hint-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .birthday-intro.intro-finished {
      opacity: 0;
      pointer-events: none;
    }

    body.birthday-revealed {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(ellipse at 10% 8%, rgba(255,255,255,.9), transparent 36%),
        radial-gradient(ellipse at 90% 26%, rgba(255,221,232,.72), transparent 32%),
        linear-gradient(160deg, #fff0f3 0%, #fff7e9 48%, #f4efff 100%);
      color: var(--ink);
    }

    body.birthday-revealed .hero {
      position: relative;
      inset: auto;
      width: 100%;
      min-height: 100svh;
      height: auto;
      padding: 82px 22px 50px;
      pointer-events: auto;
      background: transparent;
    }

    body.birthday-revealed .hero > * {
      visibility: visible;
      opacity: 1;
    }

    body.birthday-revealed .hero .cake-scene {
      position: relative;
      top: auto;
      left: auto;
      margin: 18px auto 8px;
      transform: none;
      opacity: 1;
      visibility: visible;
      animation:
        cake-pop 1.1s cubic-bezier(.2,.9,.3,1.2) both,
        cake-float 4s 1.1s ease-in-out infinite;
      transition: none;
    }

    body.birthday-revealed .cake-scene .cake-sparkle {
      opacity: 1;
    }

    body.birthday-revealed .hero h1,
    body.birthday-revealed .hero .party-hat,
    body.birthday-revealed .hero .eyebrow,
    body.birthday-revealed .hero .hero-subtitle,
    body.birthday-revealed .hero .hero-open-button,
    body.birthday-revealed .hero .tiny-note {
      animation: fade-up .8s both;
    }

    /* =====================================
       ANIMATION KEYFRAMES
    ===================================== */

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cake-pop {
      0% {
        opacity: 0;
        transform: translateY(70px) scale(.72);
      }
      70% {
        opacity: 1;
        transform: translateY(-8px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cake-float {
      0%, 100% {
        translate: 0 0;
      }
      50% {
        translate: 0 -8px;
      }
    }

    @keyframes flame-flicker {
      from {
        transform: scale(.9) rotate(-5deg);
        opacity: .86;
      }
      to {
        transform: scale(1.08) rotate(5deg);
        opacity: 1;
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: .45;
        transform: scale(.85) rotate(-8deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.12) rotate(8deg);
      }
    }

    @keyframes hat-wobble {
      0%, 100% {
        transform: rotate(-5deg);
      }
      50% {
        transform: rotate(6deg);
      }
    }

    @keyframes flag-sway {
      from {
        transform: rotate(-5deg);
      }
      to {
        transform: rotate(5deg);
      }
    }

    @keyframes confetti-fall {
      0% {
        transform: translateY(-5vh) rotate(0);
        opacity: 0;
      }
      10% {
        opacity: .9;
      }
      100% {
        transform: translateY(105vh) rotate(540deg);
        opacity: 0;
      }
    }

    @keyframes balloon-rise {
      0% {
        transform: translateY(0) translateX(0) rotate(-5deg);
        opacity: 0;
      }
      10% {
        opacity: .72;
      }
      50% {
        transform: translateY(-55vh) translateX(18px) rotate(5deg);
      }
      100% {
        transform: translateY(-115vh) translateX(-15px) rotate(-6deg);
        opacity: 0;
      }
    }

    @keyframes greeting-disappear {
      0%, 75% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes firework-text {
      0% {
        opacity: 0;
        transform: scale(.15);
        filter: blur(9px);
      }
      25% {
        opacity: 1;
        transform: scale(1.08);
        filter: blur(0);
      }
      60% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scale(1.12);
        filter: blur(5px);
      }
    }

    @keyframes firework-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.15);
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(
          calc(-50% + var(--burst-x) * 95px),
          calc(-50% + var(--burst-y) * 65px)
        ) scale(1.6);
      }
    }

    @keyframes candle-blow {
      0% {
        transform: rotate(0) translateX(0);
        opacity: 1;
      }
      35% {
        transform: rotate(18deg) translateX(7px);
        opacity: 1;
      }
      70% {
        transform: rotate(-10deg) translateX(-3px);
        opacity: .8;
      }
      100% {
        transform: rotate(0) translateX(0);
        opacity: 1;
      }
    }

    @keyframes flame-blow {
      0% {
        transform: rotate(0) scale(1);
        opacity: 1;
      }
      25% {
        transform: rotate(45deg) scale(.8,.9);
      }
      60% {
        transform: rotate(65deg) scale(.45,.7);
        opacity: .65;
      }
      100% {
        transform: rotate(70deg) scale(.1,.2);
        opacity: 0;
      }
    }

    @keyframes smoke-rise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(.5);
      }
      25% {
        opacity: .6;
      }
      100% {
        opacity: 0;
        transform: translateY(-17px) scale(1.8);
      }
    }

    @media (max-width: 380px) {
      body.intro-running .cake-scene {
        transform: translate(-50%, -50%) scale(.78);
      }

      body.intro-running .cake-scene .candles {
        width: 105px;
      }

      .hero {
        padding-right: 16px;
        padding-left: 16px;
      }

      .cake-bottom {
        width: 220px;
      }

      .cake-plate {
        width: 252px;
      }
    }

    @media (min-width: 600px) {
      .hero {
        padding-top: 100px;
      }

      .hero-subtitle {
        max-width: 430px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page-decor *,
      .cake-scene,
      .cake-sparkle,
      .party-hat,
      .firework-greeting,
      .firework-greeting span,
      .firework-greeting span::before,
      .firework-greeting span::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body class="intro-running">

  <!-- CINEMATIC INTRO -->
  <div
    class="birthday-intro"
    id="birthday-intro"
    aria-label="Birthday candle surprise"
  >
    <div class="firework-greeting" aria-hidden="true">
      <span>HAPPY BIRTHDAY</span>
    </div>

    <div class="intro-vignette" aria-hidden="true"></div>

    <button
      class="blow-button"
      id="blow-button"
      type="button"
      aria-label="Tap to blow out the candles"
    >
      Tap to blow out the candles
    </button>

    <p class="blow-hint" id="blow-hint" aria-live="polite">
      Tap here to blow the candles
    </p>
  </div>


  <!-- ANIMATED BACKGROUND -->
  <div class="page-decor" aria-hidden="true">

    <div class="bunting">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="ribbon ribbon-one"></div>
    <div class="ribbon ribbon-two"></div>

    <div class="confetti confetti-one"></div>
    <div class="confetti confetti-two"></div>
    <div class="confetti confetti-three"></div>
    <div class="confetti confetti-four"></div>
    <div class="confetti confetti-five"></div>
    <div class="confetti confetti-six"></div>

    <div class="balloon balloon-blue"><i></i></div>
    <div class="balloon balloon-pink"><i></i></div>
    <div class="balloon balloon-yellow"><i></i></div>
    <div class="balloon balloon-green"><i></i></div>
    <div class="balloon balloon-purple"><i></i></div>

  </div>


  <!-- ONLY THE FIRST BIRTHDAY SCREEN -->
  <main class="hero" id="top">

    <div class="party-hat" aria-hidden="true">🎉</div>

    <p class="eyebrow">A little celebration just for you</p>

    <h1>
      Happy Birthday,<br>
      <span>Big Brother!</span>
    </h1>

    <p class="hero-subtitle">
      Today is your day! Be hapi hapi ;D
    </p>


    <!-- CAKE WITH 19 CANDLES -->
    <div
      class="cake-scene"
      id="birthday-cake"
      aria-label="A white and gold birthday cake with nineteen candles"
    >

      <div class="cake-sparkle sparkle-a" aria-hidden="true">✦</div>
      <div class="cake-sparkle sparkle-b" aria-hidden="true">✧</div>
      <div class="cake-sparkle sparkle-c" aria-hidden="true">✦</div>

      <div class="candles" id="candles" aria-label="19 candles"></div>

      <div class="cake cake-top">
        <span class="icing-drip"></span>
      </div>

      <div class="cake cake-middle">
        <span class="gold-line"></span>
        <span class="icing-drip"></span>
      </div>

      <div class="cake cake-bottom">
        <span class="gold-line"></span>
        <span class="icing-drip"></span>
      </div>

      <div class="cake-plate"></div>

    </div>


    <!-- LINK TO THE SEPARATE LETTER PAGE -->
    <a class="primary-button hero-open-button" href="main.html">
      He he. This's main part bro. <span aria-hidden="true"><b>◎</b></span>
    </a>

    <p class="tiny-note">Made by Aizen Meraki</p>

  </main>


  <!-- INTRO / CANDLE-BLOWING SCRIPT -->
  <script>
    (() => {
      const body = document.body;
      const intro = document.getElementById("birthday-intro");
      const cake = document.getElementById("birthday-cake");
      const candleHolder = document.getElementById("candles");
      const blowButton = document.getElementById("blow-button");
      const blowHint = document.getElementById("blow-hint");

      const candleCount = 19;

      let readyToBlow = false;
      let finished = false;

      // Create exactly 19 candles.
      for (let index = 0; index < candleCount; index++) {
        const candle = document.createElement("span");

        candle.className = "candle";
        candle.setAttribute("aria-label", `Candle ${index + 1}`);
        candle.dataset.index = String(index);

        const flame = document.createElement("i");
        flame.setAttribute("aria-hidden", "true");

        candle.appendChild(flame);
        candleHolder.appendChild(candle);
      }


      // Firework intro, followed by the cake reveal.
      window.setTimeout(() => {
        intro.classList.add("fade-to-dark");
      }, 800);

      window.setTimeout(() => {
        body.classList.add("candles-revealing");
        cake.classList.add("cake-revealed");
      }, 2800);

      // Allow tapping after the cake and candles appear.
      window.setTimeout(() => {
        readyToBlow = true;

        blowButton.classList.add("button-visible");
        blowHint.classList.add("hint-visible");
      }, 5800);


      function extinguish(candle) {
        if (
          !candle ||
          candle.classList.contains("extinguished") ||
          candle.classList.contains("extinguishing")
        ) {
          return;
        }

        candle.classList.add("extinguishing");

        window.setTimeout(() => {
          candle.classList.remove("extinguishing");
          candle.classList.add("extinguished");
        }, 650);
      }


      function extinguishRandomly(amount) {
        const lit = Array.from(
          candleHolder.querySelectorAll(
            ".candle:not(.extinguished):not(.extinguishing)"
          )
        );

        for (let i = lit.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [lit[i], lit[j]] = [lit[j], lit[i]];
        }

        lit.slice(0, amount).forEach(extinguish);
      }


      function finishIntro() {
        if (finished) return;

        finished = true;

        body.classList.remove("intro-running");
        body.classList.add("birthday-revealed");

        intro.classList.add("intro-finished");

        blowButton.disabled = true;
        blowHint.textContent =
          "Wish made! Happy Birthday, Big Brother!";

        // Remove the intro overlay once its fade-out finishes.
        window.setTimeout(() => {
          intro.hidden = true;
        }, 1000);
      }


      // Every tap blows out a few candles.
      blowButton.addEventListener("click", () => {
        if (!readyToBlow || finished) return;

        const remaining = candleHolder.querySelectorAll(
          ".candle:not(.extinguished):not(.extinguishing)"
        ).length;

        if (remaining <= 4) {
          extinguishRandomly(remaining);
          blowHint.textContent = "One last blow...";

          window.setTimeout(finishIntro, 850);
          return;
        }

        const amount = Math.min(
          remaining,
          Math.floor(Math.random() * 4) + 1
        );

        extinguishRandomly(amount);

        const after = remaining - amount;

        blowHint.textContent = after <= 4
          ? "Almost there — one more tap!"
          : "Again! Keep blowing...";
      });

    })();
  </script>

</body>
</html>
